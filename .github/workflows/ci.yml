name: CI

on:
  push:
    branches: [main, fix/calendar-range-data-consistency]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bootstrap TypeScript ESLint parser and lockfile
        if: github.event_name == 'push' && github.ref_name == 'fix/calendar-range-data-consistency'
        run: |
          npm install --save-dev @typescript-eslint/parser@^8.46.3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(lint): install TypeScript ESLint parser" || true
          git push origin HEAD:fix/calendar-range-data-consistency
      - name: Install parser for PR verification
        if: github.event_name != 'push'
        run: npm install --no-save @typescript-eslint/parser@^8.46.3
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck and production build
        run: npm run build
